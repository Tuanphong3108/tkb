<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang cập nhật - Thời Khóa Biểu 10A2</title>

  <!-- Prevent caching of this file -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#65558f">

  <!-- Google Sans Flex & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      /* M3 Expressive Light Color Palette */
      --md-sys-color-background: #fdf7ff;
      --md-sys-color-on-background: #1d1b20;
      --md-sys-color-surface: #f7f2fa;
      --md-sys-color-surface-container: #ece6f0;

      --md-sys-color-primary: #65558f;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;

      --md-sys-color-secondary: #625b71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #e8def8;
      --md-sys-color-on-secondary-container: #1d192b;

      --md-sys-color-tertiary: #7d5260;
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-tertiary-container: #ffd8e4;

      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #cac4d0;

      /* M3 Spring Physics Easing */
      --md-motion-spring-expressive: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --md-motion-spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Auto Dark Mode from System */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-background: #0f0d13;
        --md-sys-color-on-background: #e9e0e8;
        --md-sys-color-surface: #17141d;
        --md-sys-color-surface-container: #262130;

        --md-sys-color-primary: #d0bcff;
        --md-sys-color-on-primary: #3700b3;
        --md-sys-color-primary-container: #4f378b;
        --md-sys-color-on-primary-container: #eaddff;

        --md-sys-color-secondary: #ccc2dc;
        --md-sys-color-on-secondary: #332d41;
        --md-sys-color-secondary-container: #4a4458;
        --md-sys-color-on-secondary-container: #e8def8;

        --md-sys-color-tertiary: #f2b8b5;
        --md-sys-color-tertiary-container: #8c1d18;

        --md-sys-color-outline: #948f99;
        --md-sys-color-outline-variant: #49454f;
      }
    }

    body {
      font-family: 'Google Sans Flex', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .expressive-title {
      font-variation-settings: 'wght' 850, 'opsz' 48, 'GRAD' 100;
    }
    .expressive-subtitle {
      font-variation-settings: 'wght' 650, 'opsz' 24;
    }

    /* Morphing Shape Animation */
    @keyframes m3-morph-pulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      }
      50% {
        transform: scale(1.1) rotate(180deg);
        border-radius: 63% 37% 37% 63% / 56% 58% 42% 44%;
      }
    }
    .animate-m3-morph {
      animation: m3-morph-pulse 12s infinite ease-in-out;
    }

    /* Spin Animation cho icon đang cập nhật */
    @keyframes spin-anim {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .spin-icon {
      animation: spin-anim 1.4s linear infinite;
    }

    /* Radar Ping cho status dot */
    @keyframes ping-slow {
      0% { transform: scale(0.9); opacity: 0.8; }
      70%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .ping-circle {
      animation: ping-slow 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-primary);
      border: 1px solid rgba(101, 85, 143, 0.25);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--md-sys-color-primary);
      position: relative;
    }

    /* Thanh tiến trình vô định (indeterminate) */
    .progress-track {
      width: 100%;
      max-width: 280px;
      height: 6px;
      border-radius: 9999px;
      background-color: var(--md-sys-color-surface-container);
      overflow: hidden;
      position: relative;
    }
    @keyframes progress-indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 20%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    .progress-bar {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 9999px;
      background-color: var(--md-sys-color-primary);
      animation: progress-indeterminate 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 flex flex-col justify-between items-center overflow-hidden relative select-none">

  <header class="w-full max-w-7xl px-6 py-6 flex justify-between items-center z-10">
    <div class="flex items-center gap-3.5">
      <img
        src="https://lh3.googleusercontent.com/a/ACg8ocK1ghp_0vaVGK6czFhTwIBo0asg1GAhSQ4xwdm9kL9kAmu8BneC=s0-c"
        alt="Phong VN Avatar"
        class="w-11 h-11 rounded-2xl object-cover ring-2 ring-[var(--md-sys-color-primary)]/40 shadow-sm"
        onerror="this.src='https://placehold.co/100x100/65558f/ffffff?text=PVN'"
      />
      <div class="flex flex-col">
        <span class="expressive-title font-bold tracking-tight text-lg text-[var(--md-sys-color-on-background)] leading-none mb-1">Phong VN</span>
        <span class="text-[11px] font-semibold tracking-wider text-[var(--md-sys-color-primary)] opacity-90">Build web just for fun</span>
      </div>
    </div>

    <!-- Status pill -->
    <div class="status-badge">
      <div class="relative flex items-center justify-center">
        <div class="status-dot"></div>
        <div class="ping-circle absolute w-2 h-2 rounded-full" style="background-color: var(--md-sys-color-primary);"></div>
      </div>
      <span id="statusText">Đang cập nhật...</span>
    </div>
  </header>

  <main class="w-full max-w-4xl px-6 z-10 my-auto flex flex-col items-center justify-center text-center">

    <!-- Hero Graphic -->
    <div class="relative flex items-center justify-center my-4">
      <div class="w-60 h-60 sm:w-72 sm:h-72 bg-[var(--md-sys-color-primary-container)]/30 animate-m3-morph absolute -z-10 blur-md"></div>

      <div class="relative w-36 h-36 sm:w-40 sm:h-40 rounded-[36px] bg-[var(--md-sys-color-surface-container)] border border-[var(--md-sys-color-outline-variant)]/40 flex items-center justify-center shadow-md">
        <span id="heroIcon" class="material-symbols-outlined spin-icon text-[64px] sm:text-[72px]" style="color: var(--md-sys-color-primary);">sync</span>
      </div>
    </div>

    <!-- Main Message Text -->
    <div class="space-y-3 max-w-xl mt-2 mb-8">
      <h2 class="expressive-subtitle text-2xl sm:text-3xl font-bold text-[var(--md-sys-color-on-background)] tracking-tight">
        Đang cập nhật ứng dụng
      </h2>
      <p id="descText" class="text-base sm:text-lg text-[var(--md-sys-color-outline)] leading-relaxed font-normal">
        Đã có phiên bản mới. Ứng dụng đang tự làm mới lại toàn bộ dữ liệu, vui lòng đợi trong giây lát...
      </p>
    </div>

    <!-- Thanh tiến trình -->
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

  </main>

  <footer class="py-6 text-xs text-[var(--md-sys-color-outline)] opacity-60">
    © Phong VN. All rights reserved.
  </footer>

  <script>
    const statusText = document.getElementById('statusText');
    const descText = document.getElementById('descText');

    // Yêu cầu Service Worker (nếu đang kiểm soát trang) xoá sạch toàn bộ Cache Storage.
    // Dùng MessageChannel để chờ SW xác nhận đã xoá xong, có timeout đề phòng SW không phản hồi.
    function hardResetCacheViaSW() {
      return new Promise((resolve) => {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
          resolve(false);
          return;
        }
        const channel = new MessageChannel();
        const timeout = setTimeout(() => resolve(false), 4000);
        channel.port1.onmessage = (event) => {
          clearTimeout(timeout);
          resolve(!!(event.data && event.data.success));
        };
        navigator.serviceWorker.controller.postMessage({ type: 'HARD_RESET_CACHE' }, [channel.port2]);
      });
    }

    async function performUpdate() {
      try {
        statusText.textContent = 'Đang xoá cache cũ...';

        const resetOk = await hardResetCacheViaSW();

        // Đề phòng: chưa có Service Worker nào đang kiểm soát trang (ví dụ lần đầu),
        // tự xoá Cache Storage trực tiếp từ phía trang cho chắc chắn.
        if (!resetOk && 'caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((name) => caches.delete(name)));
        }

        // Ép Service Worker kiểm tra & cài đặt bản sw.js mới nhất nếu có
        if ('serviceWorker' in navigator) {
          statusText.textContent = 'Đang tải phiên bản mới...';
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg) await reg.update();
        }

        statusText.textContent = 'Hoàn tất!';
        descText.textContent = 'Đã cập nhật xong, đang quay lại Thời khóa biểu...';
      } catch (err) {
        console.error('Lỗi khi cập nhật:', err);
        statusText.textContent = 'Đang thử lại...';
      } finally {
        // Lưu ý: KHÔNG đụng tới localStorage ở đây, để giữ nguyên lựa chọn vị trí thời tiết
        // (weather_location_choice) và cache thời tiết của người dùng.
        setTimeout(() => {
          window.location.replace('./index.html');
        }, 900);
      }
    }

    performUpdate();
  </script>
</body>
</html>
