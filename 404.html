<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  
  <!-- Google Sans Flex & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Material Web Components (M3) -->
  <script type="module">
    import 'https://esm.run/@material/web/all.js';
  </script>

  <style>
    :root {
      /* M3 Expressive Light Color Palette */
      --md-sys-color-background: #fdf7ff;
      --md-sys-color-on-background: #1d1b20;
      --md-sys-color-surface: #f7f2fa;
      --md-sys-color-surface-container: #ece6f0;

      --md-sys-color-primary: #65558f;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;

      --md-sys-color-secondary: #625b71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #e8def8;
      --md-sys-color-on-secondary-container: #1d192b;

      --md-sys-color-tertiary: #7d5260;
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-tertiary-container: #ffd8e4;

      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #cac4d0;

      /* M3 Spring Physics Easing */
      --md-motion-spring-expressive: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --md-motion-spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Auto Dark Mode from System */
    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-background: #0f0d13;
        --md-sys-color-on-background: #e9e0e8;
        --md-sys-color-surface: #17141d;
        --md-sys-color-surface-container: #262130;

        --md-sys-color-primary: #d0bcff;
        --md-sys-color-on-primary: #3700b3;
        --md-sys-color-primary-container: #4f378b;
        --md-sys-color-on-primary-container: #eaddff;

        --md-sys-color-secondary: #ccc2dc;
        --md-sys-color-on-secondary: #332d41;
        --md-sys-color-secondary-container: #4a4458;
        --md-sys-color-on-secondary-container: #e8def8;

        --md-sys-color-tertiary: #f2b8b5;
        --md-sys-color-tertiary-container: #8c1d18;

        --md-sys-color-outline: #948f99;
        --md-sys-color-outline-variant: #49454f;
      }
    }

    body {
      font-family: 'Google Sans Flex', sans-serif;
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .expressive-title {
      font-variation-settings: 'wght' 850, 'opsz' 48, 'GRAD' 100;
    }
    .expressive-subtitle {
      font-variation-settings: 'wght' 650, 'opsz' 24;
    }

    /* Material Symbols Fill on Hover */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      transition: font-variation-settings 0.25s var(--md-motion-spring-bounce);
    }
    button:hover .material-symbols-outlined,
    a:hover .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 100, 'opsz' 24;
    }

    /* Spring Action Buttons */
    .m3-spring-btn {
      position: relative;
      overflow: hidden;
      transition: transform 0.35s var(--md-motion-spring-expressive), 
                  box-shadow 0.25s ease, 
                  background-color 0.25s ease;
    }
    .m3-spring-btn:hover {
      transform: scale(1.04) translateY(-2px);
    }
    .m3-spring-btn:active {
      transform: scale(0.94) translateY(1px);
    }

    /* Morphing Shape Animation */
    @keyframes m3-morph-pulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      }
      50% {
        transform: scale(1.1) rotate(180deg);
        border-radius: 63% 37% 37% 63% / 56% 58% 42% 44%;
      }
    }
    .animate-m3-morph {
      animation: m3-morph-pulse 12s infinite ease-in-out;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 flex flex-col justify-between items-center overflow-hidden relative select-none">

  <header class="w-full max-w-7xl px-6 py-6 flex justify-between items-center z-10">
    <div class="flex items-center gap-3.5">
      <!-- Avatar của Phong bro -->
      <img 
        src="https://lh3.googleusercontent.com/a/ACg8ocK1ghp_0vaVGK6czFhTwIBo0asg1GAhSQ4xwdm9kL9kAmu8BneC=s0-c" 
        alt="Phong VN Avatar" 
        class="w-11 h-11 rounded-2xl object-cover ring-2 ring-[var(--md-sys-color-primary)]/40 shadow-sm"
        onerror="this.src='https://placehold.co/100x100/65558f/ffffff?text=PVN'"
      />
      <div class="flex flex-col">
        <span class="expressive-title font-bold tracking-tight text-lg text-[var(--md-sys-color-on-background)] leading-none mb-1">Phong VN</span>
        <span class="text-[11px] font-semibold tracking-wider text-[var(--md-sys-color-primary)] opacity-90">Build web just for fun</span>
      </div>
    </div>
  </header>

  <main class="w-full max-w-4xl px-6 z-10 my-auto flex flex-col items-center justify-center text-center">
    
    <!-- Hero Graphic & 404 Title -->
    <div class="relative flex items-center justify-center my-4">
      <div class="w-60 h-60 sm:w-80 sm:h-80 bg-[var(--md-sys-color-primary-container)]/30 animate-m3-morph absolute -z-10 blur-md"></div>
      
      <h1 class="expressive-title text-[120px] sm:text-[180px] md:text-[210px] font-black leading-none tracking-tighter text-transparent bg-clip-text bg-gradient-to-tr from-[var(--md-sys-color-primary)] via-[var(--md-sys-color-tertiary)] to-[var(--md-sys-color-secondary)] drop-shadow-md">
        404
      </h1>
    </div>

    <!-- Main Message Text (Chuyên nghiệp & Chuẩn mực) -->
    <div class="space-y-3 max-w-xl mt-2 mb-10">
      <h2 class="expressive-subtitle text-2xl sm:text-3xl font-bold text-[var(--md-sys-color-on-background)] tracking-tight">
        Trang bạn tìm kiếm không tồn tại
      </h2>
      <p class="text-base sm:text-lg text-[var(--md-sys-color-outline)] leading-relaxed font-normal">
        Đường dẫn có thể bị hỏng, đã bị thay đổi hoặc không còn sẵn có. Vui lòng sử dụng các tùy chọn dưới đây để tiếp tục truy cập.
      </p>
    </div>

    <!-- Action Navigation Buttons -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-4 w-full max-w-xl">
      
      <!-- Action 1: Quay lại -->
      <button onclick="window.history.back()" class="m3-spring-btn flex-1 flex items-center justify-center gap-2.5 px-6 py-4 rounded-2xl bg-[var(--md-sys-color-secondary-container)] text-[var(--md-sys-color-on-secondary-container)] font-semibold text-base shadow-sm">
        <span class="material-symbols-outlined text-2xl">arrow_back</span>
        <span>Quay lại</span>
      </button>

      <!-- Action 2: Về trang chủ -->
      <a href="https://tuanphong3108.github.io" target="_self" class="m3-spring-btn flex-[1.3] flex items-center justify-center gap-2.5 px-7 py-4 rounded-2xl bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] font-bold text-base shadow-md">
        <span class="material-symbols-outlined text-2xl">home</span>
        <span>Trang chủ</span>
      </a>

      <!-- Action 3: Danh sách ứng dụng -->
      <a href="https://tuanphong3108.github.io/apps.html" target="_self" class="m3-spring-btn flex-1 flex items-center justify-center gap-2.5 px-6 py-4 rounded-2xl bg-[var(--md-sys-color-surface-container)] border border-[var(--md-sys-color-outline-variant)]/60 text-[var(--md-sys-color-primary)] font-semibold text-base shadow-sm">
        <span class="material-symbols-outlined text-2xl">apps</span>
        <span>Ứng dụng</span>
      </a>

    </div>

  </main>

  <footer class="py-6 text-xs text-[var(--md-sys-color-outline)] opacity-60">
    © Phong VN. All rights reserved.
  </footer>

</body>
  </html>
